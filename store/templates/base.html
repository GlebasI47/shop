{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Магазин{% endblock %} — TechShop</title>
    <link rel="stylesheet" href="{% static 'store/style.css' %}">
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a href="{% url 'product_list' %}" class="logo">Tech<span>Shop</span></a>
            <nav class="nav">
                <a href="{% url 'product_list' %}">Каталог</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'cart' %}">Корзина</a>
                    <a href="{% url 'orders' %}">Мои заказы</a>
                    <span class="nav__user">{{ user.username }}</span>
                    <form method="post" action="{% url 'logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn--ghost">Выйти</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Войти</a>
                    <a href="{% url 'register' %}" class="btn btn--small">Регистрация</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="container main">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">© 2026 TechShop — учебный проект на Django</div>
    </footer>
</body>
</html>
