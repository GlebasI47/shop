{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
    <div class="auth">
        <h1>Вход</h1>
        <form method="post" class="form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn--big btn--wide">Войти</button>
        </form>
        <p class="hint">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
    </div>
{% endblock %}
