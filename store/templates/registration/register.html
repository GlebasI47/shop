{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
    <div class="auth">
        <h1>Регистрация</h1>
        <form method="post" class="form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn--big btn--wide">Зарегистрироваться</button>
        </form>
        <p class="hint">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
    </div>
{% endblock %}
