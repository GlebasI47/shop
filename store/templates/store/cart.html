<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Корзина</title>
</head>
<body>
    <h1>Корзина</h1>
    {% if items %}
        <ul>
            {% for item in items %}
                <li>{{ item.product.name }} — {{ item.quantity }} шт. × {{ item.product.price }} = {{ item.total_price }} руб.</li>
            {% endfor %}
        </ul>
        <p><b>Итого: {{ total }} руб.</b></p>
    {% else %}
        <p>Корзина пуста.</p>
    {% endif %}
    <p><a href="{% url 'product_list' %}">← В каталог</a></p>
</body>
</html>
