<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Магазин</title>
</head>
<body>
    <h1>Каталог товаров</h1>
    <ul>
        {% for product in products %}
            <li>{{ product.name }} — {{ product.price }} руб. ({{ product.category.name }})</li>
        {% endfor %}
    </ul>
</body>
</html>
